<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eko-Learn — Biolarvasida & Keseimbangan Ekosistem</title>
<meta name="theme-color" content="#0b2a21">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23d4622a'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>:root{--deep:#0b2a21;--deep2:#12392d;--deep3:#1a4a3b;--leaf:#2c8a58;--leaf2:#79c79b;--gl:#eef5ec;--gl2:#dbe9d7;--terra:#d4622a;--terra2:#f3d9c9;--am:#e9b44c;--ink:#14231b;--mut:#62706a;--line:#e1d9c8;--paper:#f4efe3;--card:#fffdf8;--red:#b83a2b;--bl:#2b6cb0;--r:16px;
--f-serif:"Fraunces","Playfair Display",Georgia,"Times New Roman",serif;--f-sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-mono:"JetBrains Mono","IBM Plex Mono",ui-monospace,Consolas,monospace;
--g1:var(--deep);--g2:var(--leaf);--g3:var(--leaf2)}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;font:16px/1.65 var(--f-sans);color:var(--ink);background:var(--paper)}
h1,h2,h3,h4{font-family:var(--f-serif);line-height:1.2;margin:0 0 .5em;color:var(--deep);font-weight:700;letter-spacing:-.01em}h1{font-size:2.1rem}h2{font-size:1.55rem;margin-top:1.4em}h3{font-size:1.18rem}h4{font-size:1.02rem}
p{margin:.4em 0 .8em}a{color:var(--leaf)}img{max-width:100%;height:auto;display:block}
.hide{display:none!important}.mut{color:var(--mut)}.sm{font-size:.86rem}.c{text-align:center}
.eyebrow{font:600 .72rem/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--terra)}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:276px minmax(0,1fr);min-height:100vh}
body.guest .shell{grid-template-columns:1fr}body.guest header.top,body.guest footer{display:none}body.guest main{max-width:none;padding:0}
header.top{position:sticky;top:0;height:100vh;background:var(--deep);color:#d6e8dc;display:flex;flex-direction:column;padding:22px 16px 16px;overflow-y:auto;
background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px}
header.top .brand{display:flex;align-items:center;gap:11px;color:#fff;text-decoration:none;font:700 1.35rem var(--f-serif);padding:2px 8px 18px}
header.top .brand i{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;background:var(--terra);color:#fff;font-style:normal;font-size:1.15rem;box-shadow:0 0 0 4px rgba(212,98,42,.22)}
header.top .brand small{display:block;font:500 .64rem var(--f-mono);letter-spacing:.14em;color:#8fb7a2;text-transform:uppercase;margin-top:1px}
.burger{display:none}
nav.menu{display:flex;flex-direction:column;gap:2px;flex:1}
nav.menu .grp{font:600 .65rem var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:#6f9a86;padding:14px 10px 6px}
nav.menu a{display:flex;align-items:center;gap:10px;color:#cfe3d6;text-decoration:none;font-size:.93rem;padding:8px 10px;border-radius:10px;line-height:1.3}
nav.menu a .ix{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font:600 .74rem var(--f-mono);background:rgba(255,255,255,.08);color:#a8cbb7}
nav.menu a .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.menu a:hover{background:rgba(255,255,255,.08);color:#fff}
nav.menu a.on{background:#fff;color:var(--deep);font-weight:600}nav.menu a.on .ix{background:var(--terra);color:#fff}
.sbu{margin-top:14px;border-top:1px solid rgba(255,255,255,.12);padding:14px 6px 0;display:flex;align-items:center;gap:10px}
.sbu .av{flex:none;width:36px;height:36px;border-radius:50%;background:var(--am);color:var(--deep);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.sbu .nm{flex:1;min-width:0;font-size:.86rem;line-height:1.25;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sbu .nm small{display:block;color:#8fb7a2;font:500 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.sbu button{background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:9px;padding:7px 11px;cursor:pointer;font:600 .8rem var(--f-sans)}.sbu button:hover{background:var(--terra)}
.wrap{min-width:0;display:flex;flex-direction:column}
main{width:100%;max-width:1080px;margin:0 auto;padding:30px 28px 70px;flex:1}
footer{text-align:center;color:var(--mut);font:.72rem var(--f-mono);letter-spacing:.04em;padding:22px 10px;border-top:1px solid var(--line)}
@media(max-width:980px){
 .shell{grid-template-columns:1fr}
 header.top{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 14px;overflow:visible}
 header.top .brand{padding:0;font-size:1.15rem}header.top .brand i{width:32px;height:32px}header.top .brand small{display:none}
 .burger{display:block;margin-left:auto;background:rgba(255,255,255,.1);border:0;color:#fff;border-radius:10px;padding:7px 13px;font-size:1.1rem;cursor:pointer}
 nav.menu,.sbu{display:none;width:100%;flex:none}
 header.top.open{max-height:100vh;overflow-y:auto}header.top.open nav.menu,header.top.open .sbu{display:flex}header.top.open nav.menu{padding-top:8px}
 main{padding:20px 14px 60px}h1{font-size:1.7rem}}
/* ---------- komponen dasar ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;margin:0 0 16px;box-shadow:0 1px 0 rgba(20,35,27,.03),0 10px 24px -18px rgba(20,35,27,.28)}
.card>h3:first-child{display:flex;align-items:center;gap:9px}.card>h3:first-child::before{content:"";flex:none;width:9px;height:9px;border-radius:2px;background:var(--terra);transform:rotate(45deg)}
.card.tint{background:var(--gl);border-color:var(--gl2)}
.card.dark{background:var(--deep);color:#d6e8dc;border-color:var(--deep)}.card.dark h3{color:#fff}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:7px;background:var(--deep);color:#fff;border:0;border-radius:11px;padding:10px 18px;font:600 .93rem var(--f-sans);cursor:pointer;text-decoration:none;transition:transform .12s,background .12s}
.btn:hover{background:var(--leaf);transform:translateY(-1px)}.btn.ghost{background:transparent;color:var(--deep);border:1.5px solid var(--deep)}.btn.ghost:hover{background:var(--deep);color:#fff}
.btn.am{background:var(--terra);color:#fff}.btn.am:hover{background:#b9501d}.btn.red{background:var(--red)}.btn.sm{padding:5px 11px;font-size:.82rem;border-radius:9px}.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.badge{display:inline-block;font:600 .68rem/1.5 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--gl2);color:var(--deep);vertical-align:middle}
.badge.am{background:#fbe9c4;color:#6b4a00}.badge.red{background:#f7d9d3;color:#8e2417}.badge.bl{background:#dbe9f8;color:#1c4a7d}.badge.gr{background:#ebe6d9;color:#5b6159}
.sx{display:inline-flex;align-items:center;gap:6px;background:#fff4ea;border:1px solid #efc7ab;color:#8a3a12;border-radius:8px;padding:1px 9px;font:600 .68rem var(--f-mono);letter-spacing:.03em}
label{display:block;font-weight:600;margin:13px 0 5px;font-size:.9rem}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1.5px solid #d3cab6;border-radius:11px;background:#fff;color:var(--ink)}
textarea{min-height:88px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid rgba(44,138,88,.25);border-color:var(--leaf)}
input[disabled],textarea[disabled],select[disabled]{background:#f1eee5;color:#7a8179}
.quote{display:block;border-left:4px solid var(--terra);background:#fff7ef;padding:12px 16px;border-radius:0 12px 12px 0;margin:12px 0;font:italic 1.02rem/1.55 var(--f-serif)}
.note{background:#eaf3f9;border-left:4px solid var(--bl);padding:11px 15px;border-radius:0 12px 12px 0;margin:12px 0}
.eq{background:var(--gl);border:1px dashed var(--leaf);border-radius:12px;padding:10px 14px;text-align:center;font:1.08rem var(--f-serif);margin:10px 0}
figure{margin:14px 0}figcaption{font-size:.82rem;color:var(--mut);text-align:center;margin-top:6px}figure img{border-radius:12px;margin:0 auto}
svg.art{width:100%;height:auto;color:var(--deep);display:block;margin:0 auto}svg.art:not(.flat){max-width:430px}
svg.art .an{fill:var(--card);stroke:currentColor;stroke-width:1.6}svg.art .ag{fill:var(--leaf2);stroke:currentColor;stroke-width:1.4}svg.art .ag .wing{fill:#fff;opacity:.8}svg.art .ln{stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round}
svg.art .al{font:700 14px var(--f-serif);fill:currentColor}svg.art .as{font:500 10.5px var(--f-sans);fill:currentColor;opacity:.75}svg.art .as.b{opacity:1;font-weight:600;font-size:11.5px}
svg.art .ac{font:600 10.5px var(--f-mono);letter-spacing:.18em;fill:var(--terra)}svg.art .ad{font:italic 700 25px var(--f-serif);fill:currentColor}
svg.art.lf .al{font-size:19px}svg.art.lf .as{font-size:14.5px}svg.art.lf .ad{font-size:28px}svg.art.lf .ac{font-size:12px}svg.art.lf{max-width:520px}
svg.art .pn{fill:#f8f4e9;stroke:var(--line)}svg.art .bx{stroke:currentColor;stroke-width:1.2}svg.art .bx.a{fill:#e6f0f7}svg.art .bx.b{fill:var(--gl2)}
table{width:100%;border-collapse:collapse;font-size:.88rem;background:#fff;border-radius:10px;overflow:hidden}th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{background:var(--deep);color:#fff;font:600 .74rem var(--f-mono);letter-spacing:.05em;text-transform:uppercase;border-color:var(--deep2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}td input{padding:5px 7px;min-width:62px}
.dt td,.dt th{text-align:center}.dt td:first-child,.dt th:first-child{text-align:left;white-space:nowrap}
.bar{height:10px;border-radius:6px;background:var(--gl2);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf),var(--leaf2))}
.chart{display:flex;gap:10px;align-items:flex-end;height:140px;padding:8px 4px 0;border-bottom:2px solid var(--deep)}
.chart div{flex:1;background:var(--leaf);border-radius:6px 6px 0 0;position:relative;min-height:2px}.chart div span{position:absolute;top:-19px;left:0;right:0;text-align:center;font:600 .72rem var(--f-mono)}
.chart-l{display:flex;gap:10px;font-size:.76rem;text-align:center}.chart-l div{flex:1}
/* ---------- beranda ---------- */
.hero{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:center;background:var(--deep);color:#d6e8dc;border-radius:22px;padding:38px 36px;margin-bottom:18px;overflow:hidden;
background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),radial-gradient(circle at 85% 20%,rgba(212,98,42,.35),transparent 45%);background-size:36px 36px,36px 36px,auto}
.hero h1{color:#fff;font-size:2.5rem;line-height:1.08;margin:10px 0 14px}.hero h1 em{font-style:italic;color:var(--am)}.hero p{color:#c3dccf;max-width:520px}
.hero .kick{font:600 .72rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--am)}
.hero .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.hero .btn.ghost{color:#fff;border-color:rgba(255,255,255,.5)}.hero .btn.ghost:hover{background:#fff;color:var(--deep)}
.hero svg.art,.split .side svg.art{color:#e4f1e9}.hero svg.art .an,.split .side svg.art .an{fill:var(--deep2);stroke:#e4f1e9}.hero svg.art .ag,.split .side svg.art .ag{stroke:#0b2a21}.hero svg.art .ln,.split .side svg.art .ln{stroke:#0b2a21}.hero svg.art .ln[stroke-dasharray],.split .side svg.art .ln[stroke-dasharray]{stroke:#0b2a21}.hero svg.art .ac,.split .side svg.art .ac{fill:var(--am)}
@media(max-width:860px){.hero{grid-template-columns:1fr;padding:26px 20px}.hero h1{font-size:1.9rem}.hero .artbox{max-width:320px;margin:0 auto}}
.dstrip{display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.dstrip div{padding:16px 18px;border-right:1px solid var(--line)}.dstrip div:last-child{border:0}
.kpi{font:800 2.1rem/1 var(--f-mono);color:var(--terra);letter-spacing:-.04em}.dstrip small{display:block;margin-top:6px;font:600 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
@media(max-width:620px){.dstrip{grid-template-columns:repeat(2,1fr)}.dstrip div:nth-child(2){border-right:0}.dstrip div:nth-child(-n+2){border-bottom:1px solid var(--line)}}
.sec{display:flex;align-items:baseline;gap:12px;margin:26px 0 12px}.sec h2{margin:0}.sec .eyebrow{white-space:nowrap}.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.pcard{display:grid;grid-template-columns:auto 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-decoration:none;color:inherit;margin:0;transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;overflow:hidden}
.pcard:hover{transform:translateY(-3px);box-shadow:0 16px 30px -18px rgba(20,35,27,.45);border-color:var(--leaf)}
.pcard .pn{font:800 3rem/1 var(--f-serif);color:var(--terra2);letter-spacing:-.04em}.pcard:hover .pn{color:var(--terra)}
.pcard h3{margin:6px 0 4px}.pcard p{margin:0 0 10px;color:var(--mut);font-size:.88rem}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin:10px 0}.gal figure{margin:0}.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
/* ---------- pertemuan ---------- */
.phead{display:flex;gap:22px;align-items:center;background:var(--deep);color:#d6e8dc;border-radius:20px;padding:26px 30px;margin-bottom:16px;position:relative;overflow:hidden;
background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:32px 32px}
.phead .big{flex:none;font:900 5.2rem/.85 var(--f-serif);color:var(--terra);letter-spacing:-.06em}
.phead h1{color:#fff;font-size:1.9rem;margin:6px 0 6px}.phead .tema{color:#b5d3c3;font-size:.93rem;margin:0}.phead .eyebrow{color:var(--am)}.phead .sx{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#ffe3c4;margin:4px 4px 0 0}
@media(max-width:640px){.phead{padding:20px;gap:14px}.phead .big{font-size:3.2rem}.phead h1{font-size:1.4rem}}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 18px;padding:5px;background:#ebe5d4;border-radius:14px;scrollbar-width:thin}
.tabs a{display:flex;align-items:center;gap:8px;white-space:nowrap;padding:9px 15px;border-radius:10px;text-decoration:none;color:var(--mut);font-weight:600;font-size:.9rem}
.tabs a i{font:700 .7rem var(--f-mono);font-style:normal;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;background:rgba(20,35,27,.09)}
.tabs a.on{background:var(--deep);color:#fff;box-shadow:0 6px 14px -8px rgba(11,42,33,.6)}.tabs a.on i{background:var(--terra);color:#fff}.tabs a:hover:not(.on){background:#fff;color:var(--deep)}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:12px 0 6px;position:relative}
.flow div{position:relative;text-align:center;font-size:.72rem;line-height:1.3;padding:0 3px;color:var(--mut)}
.flow div::before{content:"";position:absolute;top:15px;left:-50%;right:50%;height:2px;background:var(--line);z-index:0}.flow div:first-child::before{display:none}
.flow div b{position:relative;z-index:1;display:grid;place-items:center;width:32px;height:32px;margin:0 auto 6px;border-radius:50%;background:#fff;border:2px solid var(--line);font:700 .85rem var(--f-mono);color:var(--mut)}
.flow div.on{color:var(--deep);font-weight:600}.flow div.on b{background:var(--terra);border-color:var(--terra);color:#fff;box-shadow:0 0 0 5px rgba(212,98,42,.18)}.flow div.on::before{background:var(--terra)}
@media(max-width:640px){.flow{grid-template-columns:repeat(3,1fr);row-gap:12px}.flow div::before{display:none}}
.step{border-left:3px solid var(--leaf);padding:4px 0 4px 14px;margin:12px 0}.step .fase{font:700 1rem var(--f-serif);color:var(--deep)}
.langkah{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}.langkah:last-child{border:0}.langkah .t{flex:1}
.poster{display:grid;gap:10px}.poster .row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.poster .no{width:42px;height:42px;border-radius:50%;background:var(--terra);color:#fff;display:grid;place-items:center;font:800 1.1rem var(--f-serif)}.poster .arr{text-align:center;color:var(--leaf);font-size:1.2rem;line-height:.6}
.spec{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start}.spec .no{font:800 2.6rem/1 var(--f-serif);color:var(--terra2)}.spec .lat{font:italic 600 .95rem var(--f-serif);color:var(--leaf)}
.spec dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0;font-size:.86rem}.spec dt{font:600 .66rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);padding-top:3px}.spec dd{margin:0}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:10px 0}summary{cursor:pointer;font:700 1.02rem var(--f-serif);color:var(--deep)}
/* ---------- forum, kuis, form ---------- */
.post{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}.post.guru{border-color:var(--leaf);background:var(--gl)}
.post .who{font-weight:700;font-size:.9rem}.post .when{font:.7rem var(--f-mono);color:var(--mut)}.post .rp{margin:8px 0 0 14px;border-left:3px solid var(--gl2);padding-left:10px}
.post .tx{white-space:pre-wrap;word-wrap:break-word;margin:4px 0}
.q{padding:14px 0;border-bottom:1px solid var(--line)}.q:last-child{border:0}.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer;background:#fff;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--leaf)}.opt input{width:auto;margin-top:5px}.opt.ok{background:#e1f2e6;border-color:var(--leaf)}.opt.no{background:#fbe4df;border-color:#e3a79f}.opt.sel{background:var(--gl);border-color:var(--leaf)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--deep);color:#fff;padding:11px 20px;border-radius:12px;z-index:99;font-size:.92rem;box-shadow:0 10px 26px rgba(0,0,0,.28);max-width:90vw}.toast.err{background:var(--red)}
.err{color:var(--red);font-size:.9rem;margin:8px 0}
.lock{background:#fff4e2;border:1px solid #f0cf94;border-radius:14px;padding:11px 15px;margin-bottom:14px}.lock.open{background:#e6f4ea;border-color:#a7d8b8}.lock.shut{background:#fbe6e3;border-color:#eba9a2}
.game{display:grid;grid-template-columns:1fr 1fr;gap:10px}.game button{text-align:left;font:inherit;background:#fff;border:2px solid var(--gl2);border-radius:12px;padding:11px;cursor:pointer;min-height:48px}
.game button.sel{border-color:var(--terra);background:#fff4ea}.game button.done{border-color:var(--leaf);background:#e1f2e6;opacity:.7;cursor:default}.game button.bad{border-color:var(--red);background:#fbe4df}
@media(max-width:560px){.game{grid-template-columns:1fr}}
.sticky-save{position:sticky;bottom:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 10px 24px -10px rgba(0,0,0,.25);margin-top:14px}
/* ---------- masuk / daftar ---------- */
.split{display:grid;grid-template-columns:1.05fr 1fr;min-height:100vh}
.split .side{background:var(--deep);color:#d6e8dc;padding:48px 44px;display:flex;flex-direction:column;justify-content:center;gap:18px;position:relative;overflow:hidden;
background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px),radial-gradient(circle at 15% 90%,rgba(212,98,42,.35),transparent 45%);background-size:36px 36px,36px 36px,auto}
.split .side h1{color:#fff;font-size:2.7rem;margin:0}.split .side h1 em{color:var(--am)}.split .side p{color:#b5d3c3;max-width:440px;margin:0}.split .side .eyebrow{color:var(--am)}.split .side svg.art{max-width:400px;margin:6px 0 0}
.split .fside{display:grid;place-items:center;padding:30px 20px}
.auth{width:100%;max-width:420px;margin:0;padding:28px}.auth .logo{width:54px;height:54px;border-radius:16px;background:var(--terra);display:grid;place-items:center;font-size:1.6rem;margin:0 0 14px;box-shadow:0 0 0 6px rgba(212,98,42,.15)}
@media(max-width:860px){.split{grid-template-columns:1fr}.split .side{padding:26px 22px;gap:10px}.split .side h1{font-size:1.9rem}.split .side svg.art{display:none}}
@media print{header.top,.sticky-save,.tabs,footer{display:none}.shell{display:block}}

  return `<div class="card tint"><h3>Kode kelas</h3><div class="grid g2"><div><input id="kode" value="${esc(kode&&kode.kode_kelas||'')}"></div><div><button class="btn" data-a="gkode">Simpan kode</button></div></div><p class="sm mut">Bagikan kode ini kepada peserta untuk mendaftar.</p></div>
  <h2>Presensi, tugas, tenggat, dan konfirmasi</h2>${pc}
  <h2>Media dan berkas pembelajaran</h2><div class="card"><p class="sm mut">Pertemuan 0 = Deskripsi Umum (video sambutan, dll). Jenis <b>template</b> tampil di tab Kerjakan; jenis <b>video</b> YouTube tampil sebagai pemantik di tab Mulai. Isi URL atau pilih berkas untuk diunggah (maks. 15 MB).</p>
  <div class="grid g4"><div><label style="margin-top:0">Pertemuan</label><select id="mp"><option>0</option>${DATA.P.map(p=>`<option>${p.id}</option>`).join('')}</select></div><div><label style="margin-top:0">Jenis</label><select id="mj"><option>video</option><option>link</option><option>dokumen</option><option>template</option><option>infografis</option></select></div><div style="grid-column:span 2"><label style="margin-top:0">Judul</label><input id="mt"></div></div>
  <div class="grid g2"><div><label>URL (https://…)</label><input id="mu" placeholder="https://…"></div><div><label>atau berkas</label><input type="file" id="mf"></div></div><button class="btn sm" style="margin-top:8px" data-a="gmedia">Tambah media</button>
  <ul>${media.map(m=>`<li>P${m.pertemuan} · ${esc(m.jenis)} · ${m.path?`<a href="#" data-a="openf" data-path="${esc(m.path)}">${esc(m.judul)}</a> (berkas)`:`<a href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">${esc(m.judul)}</a>`} <button class="btn sm ghost" data-a="gmdel" data-id="${m.id}" data-path="${esc(m.path||'')}">hapus</button></li>`).join('')}</ul></div>
  <h2>Checklist kesiapan LMS <span class="badge" id="chkc">${done.size}/${total}</span></h2><div class="card">${CHECK.map(g=>`<h4>${esc(g[0])}</h4>${g[1].map(it=>{const key=g[0]+' · '+it;return `<label style="display:flex;gap:8px;align-items:center;font-weight:400;margin:3px 0"><input type="checkbox" style="width:auto" data-a="chk" data-i="${esc(key)}" ${done.has(key)?'checked':''}> ${esc(it)}</label>`}).join('')}`).join('')}</div>
  <h2>Kelompok peserta</h2><div class="card"><div class="tw"><table><tr><th>Nama</th><th>Username</th><th>Kelompok</th></tr>${GD.pf.map(s=>`<tr><td>${esc(s.nama)}</td><td>${esc(s.username)}</td><td><input data-a="gkel" data-u="${s.id}" value="${esc(s.kelompok||'')}" style="max-width:90px"></td></tr>`).join('')}</table></div></div>`}
/* ---------- Event delegation ---------- */
const curP=()=>+(location.hash.match(/#\/p\/(\d)/)||[0,0])[1];
document.addEventListener('click',async ev=>{
  const b=ev.target.closest('[data-a]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;const a=b.dataset.a;
  try{
  if(a==='burger'){$('#top').classList.toggle('open');return}
  if(a==='logout'){try{await authCall('/auth/v1/logout',{})}catch(e){};setSes(null);me=null;location.hash='#/login';route();return}
  if(a==='reload'){route();return}
  if(a==='openf'){ev.preventDefault();const w=window.open('','_blank');try{const u=await signUrl(b.dataset.path);if(w)w.location=u;else location.href=u}catch(e){if(w)w.close();toast(e.message,1)}return}
  if(a==='hadir'){b.disabled=true;await rest('POST','presensi',{user_id:me.id,pertemuan:+b.dataset.p,status:'hadir'},'return=minimal');toast('Presensi tercatat ✔');route();return}
  if(a==='kontrak'){if(!$('#kk').checked){toast('Centang persetujuan dulu.',1);return}await UP('angket',{user_id:me.id,kind:'kontrak',jawaban:{setuju:true},hasil:{setuju:true}},'user_id,kind');toast('Tersimpan ✔');route();return}
  if(a==='fscope'){FS.scope=b.dataset.s;FS.sig='';$$('[data-a=fscope]').forEach(x=>x.classList.toggle('ghost',x!==b));drawCompose();loadForum(true);return}
  if(a==='fpost'){const t=$('#fnew').value.trim();if(!t)return;const bd=forumBody({text:t});if(FS.scope==='kelompok'&&!bd.kelompok){toast('Pilih kelompok dulu.',1);return}if(FS.scope==='pribadi'&&!bd.untuk){toast('Pilih peserta dulu.',1);return}
    b.disabled=true;try{await rest('POST','forum',bd,'return=minimal')}finally{b.disabled=false}$('#fnew').value='';FS.sig='';loadForum(true);return}
  if(a==='freply'){const box=$('#rf'+b.dataset.id);if(box.innerHTML){box.innerHTML='';return}box.innerHTML=`<textarea id="rt${b.dataset.id}" style="min-height:56px" maxlength="2000"></textarea><button class="btn sm" data-a="frsend" data-id="${b.dataset.id}">Kirim balasan</button>`;return}
  if(a==='frsend'){const t=$('#rt'+b.dataset.id).value.trim();if(!t)return;await rest('POST','forum',forumBody({text:t,parent_id:+b.dataset.id}),'return=minimal');FS.sig='';loadForum(true);return}
  if(a==='fdel'){if(!confirm('Hapus pesan ini?'))return;await rest('DELETE','forum?id=eq.'+b.dataset.id);FS.sig='';loadForum(true);return}
  if(a==='save'||a==='submit'){
    const n=curP(),k=b.dataset.k,root=$('#fm-'+b.dataset.id);const data=collectForm(root);
    if(a==='submit'&&!confirm('Kumpulkan sekarang? Kamu masih dapat memperbaiki sampai tenggat.'))return;
    const row={user_id:me.id,pertemuan:n,kind:k,data,updated_at:new Date().toISOString()};if(a==='submit')row.submitted_at=new Date().toISOString();
    b.disabled=true;try{await UP('submissions',row,'user_id,pertemuan,kind');toast(a==='submit'?'Terkumpul ✔':'Draf tersimpan ✔')}catch(e){toast(e.code==='42501'||e.status===403?'Gagal: terkunci (belum dibuka/tenggat lewat).':e.message,1)}finally{b.disabled=false}
    if(a==='submit')route();return}
  if(a==='fdelf'){if(!confirm('Hapus berkas ini?'))return;await rest('DELETE','files?id=eq.'+b.dataset.id);try{await delFile(b.dataset.path)}catch(e){}route();return}
  if(a==='quiz'){const k=b.dataset.k,Q=QUIZ[k],ans=Q.soal.map((s,i)=>{const e=document.querySelector(`input[name="${k}-${i}"]:checked`);return e?e.value:''});
    if(ans.includes('')&&!confirm('Masih ada soal yang belum dijawab. Kirim tetap?'))return;b.disabled=true;
    const once=['diagnostik','pretest','posttest'].includes(k);
    try{const r=await RPC('submit_quiz',{p_kind:k,p_answers:ans});
      $('#qr-'+k).innerHTML=`<div class="note"><b>Skor: ${r.score}</b> (${r.benar}/${r.total} benar) · percobaan ke-${r.tries}${once?'<br>Terima kasih, jawabanmu tersimpan.':''}</div>`;
      if(r.detail){r.detail.forEach((ok,i)=>{$$(`input[name="${k}-${i}"]`).forEach(inp=>{const lab=inp.closest('.opt');lab.classList.toggle('sel',inp.checked);if(inp.checked)lab.classList.add(ok?'ok':'no')})})}
      if(once){b.remove()}else b.disabled=false}
    catch(e){toast(e.message,1);b.disabled=false}return}
  if(a==='angket'){const k=b.dataset.k;let jw=[],hasil;
    if(k==='gaya'){jw=VARK.map((q,i)=>{const e=document.querySelector(`input[name="gaya-${i}"]:checked`);return e?+e.value:-1});if(jw.includes(-1)){toast('Jawab semua 16 situasi.',1);return}hasil={V:0,A:0,R:0,K:0};jw.forEach(j=>hasil[VARK_T[j]]++)}
    else{const Q=k==='nos'?NOSQ:EAQ;jw=Q.map((q,i)=>{const e=document.querySelector(`input[name="${k}-${i}"]:checked`);return e?+e.value:0});if(jw.includes(0)){toast('Jawab semua pernyataan.',1);return}const tot=jw.reduce((s,x)=>s+x,0);hasil={total:tot,maks:Q.length*4,persen:tot/(Q.length*4)*100}}
    b.disabled=true;try{await rest('POST','angket',{user_id:me.id,kind:k,jawaban:jw,hasil},'return=minimal');toast('Tersimpan ✔');route()}catch(e){toast(e.message,1);b.disabled=false}return}
  if(a==='peer'){const box=b.closest('[data-pk]'),k=box.dataset.pk;const sk=[...box.querySelectorAll('[data-pa]')].map(e=>e.value?+e.value:null);if(sk.includes(null)){toast('Isi 4 aspek (1–4).',1);return}
    try{await UP('peer',{from_user:me.id,to_kelompok:k,skor:sk,catatan:box.querySelector('[data-pc]').value,updated_at:new Date().toISOString()},'from_user,to_kelompok');toast('Penilaian tersimpan ✔')}catch(e){toast(e.code==='42501'||e.status===403?'Gagal: penilaian terkunci (tenggat) atau kelompok sendiri.':e.message,1)}return}
  if(a==='gt'){if(G.done[b.dataset.t])return;G.sel=b.dataset.t;gameDraw();return}
  if(a==='gd'){if(!G.sel)return;const d=G.defs[+b.dataset.i];if(G.pair[G.sel]===d){G.done[G.sel]=d;G.sel=null}else{G.miss++;G.sel=null;gameDraw();const bb=$$('[data-a=gd]')[+b.dataset.i];if(bb)bb.classList.add('bad');setTimeout(gameDraw,500);return}gameDraw();return}
  if(a==='gnew'){gameNew();return}
  if(a==='gsel'){GSEL.p=+b.dataset.p;if(b.dataset.t)GSEL.k='lkpd';route();return}
  if(a==='gkind'){GSEL.k=b.dataset.k;route();return}
  if(a==='gsave'){const box=$('#gr-'+b.dataset.u),n=+b.dataset.p,k=b.dataset.k;let body={catatan:box.querySelector('[data-ct]').value};
    if(k==='sumatif'){const rb=[...box.querySelectorAll('[data-rb]')].map(e=>num(e.value));if(rb.some(x=>x==null||x<0||x>100)){toast('Isi semua skor aspek (0–100).',1);return}body.rubrik=rb;body.nilai=Math.round(rb.reduce((s,x,i)=>s+x*DATA.rubrikProduk[i][1]/100,0)*10)/10}
    else{const v=num(box.querySelector('[data-nl]').value);if(v==null||v<0||v>100){toast('Nilai 0–100.',1);return}body.nilai=v}
    await rest('PATCH','submissions?user_id=eq.'+b.dataset.u+'&pertemuan=eq.'+n+'&kind=eq.'+k,body,'return=minimal');toast('Penilaian tersimpan ✔');return}
  if(a==='gcfg'){const root=$('#pc-'+b.dataset.p),g=n=>root.querySelector('[data-c='+n+']');const t=v=>v?new Date(v).toISOString():null;const au=g('absensi_url').value.trim();
    if(au&&!/^https?:\/\//i.test(au)){toast('Tautan absensi harus diawali https://',1);return}
    await rest('PATCH','pconfig?pertemuan=eq.'+b.dataset.p,{absensi_url:au||null,tugas_buka:t(g('tugas_buka').value),tugas_tenggat:t(g('tugas_tenggat').value),konfirmasi_open:g('konfirmasi_open').checked},'return=minimal');toast('Pengaturan tersimpan ✔');return}
  if(a==='gkode'){const v=$('#kode').value.trim().toUpperCase();if(v.length<4){toast('Kode minimal 4 karakter.',1);return}await rest('PATCH','app_config?id=eq.1',{kode_kelas:v},'return=minimal');toast('Kode kelas diperbarui ✔');return}
  if(a==='gmedia'){const u=$('#mu').value.trim(),t=$('#mt').value.trim(),f=$('#mf').files[0];if(!t||(!u&&!f)){toast('Isi judul dan URL atau pilih berkas.',1);return}if(u&&!/^https?:\/\//i.test(u)){toast('URL harus diawali https://',1);return}
    const body={pertemuan:+$('#mp').value,judul:t,jenis:$('#mj').value};
    if(f){const ext=(f.name.split('.').pop()||'').toLowerCase();if(!EXT.includes(ext)){toast('Format berkas tidak didukung.',1);return}if(f.size>MAXB){toast('Maksimal 15 MB.',1);return}
      const path='materi/'+Date.now()+'-'+f.name.replace(/[^A-Za-z0-9._-]/g,'_');b.disabled=true;await upFile(path,f);body.path=path}else body.url=u;
    await rest('POST','media',body,'return=minimal');toast('Media ditambahkan ✔');route();return}
  if(a==='gmdel'){await rest('DELETE','media?id=eq.'+b.dataset.id);if(b.dataset.path){try{await delFile(b.dataset.path)}catch(e){}}route();return}
  if(a==='csv'){const R=rekapRows();const k=Object.keys(R[0]||{nama:1});const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const csv='﻿'+[k.map(q).join(',')].concat(R.map(r=>k.map(c=>q(r[c])).join(','))).join('\r\n');
    const a2=document.createElement('a');a2.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a2.download='rekap-ekolearn.csv';document.body.appendChild(a2);a2.click();a2.remove();return}
  }catch(e){toast(e.message,1)}
});
document.addEventListener('change',async ev=>{
  const b=ev.target;if(!b.dataset)return;
  try{
  if(b.dataset.up){const f=b.files[0];if(!f)return;const n=curP();const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(!EXT.includes(ext)){toast('Format berkas tidak didukung.',1);b.value='';return}if(f.size>MAXB){toast('Maksimal 15 MB.',1);b.value='';return}
    toast('Mengunggah…');const path=me.id+'/p'+n+'/'+b.dataset.up+'/'+Date.now()+'-'+f.name.replace(/[^A-Za-z0-9._-]/g,'_');
    try{await upFile(path,f);await rest('POST','files',{user_id:me.id,pertemuan:n,slot:b.dataset.up,path,nama:f.name,ukuran:f.size},'return=minimal');toast('Berkas terunggah ✔');route()}
    catch(e){try{await delFile(path)}catch(x){}toast(e.status===403||e.code==='42501'?'Gagal: pengumpulan terkunci.':e.message,1)}return}
  if(!b.dataset.a)return;
  if(b.dataset.a==='popen'){await rest('PATCH','pconfig?pertemuan=eq.'+b.dataset.p,{presensi_open:b.checked},'return=minimal');toast(b.checked?'Presensi dibuka':'Presensi ditutup')}
  if(b.dataset.a==='pst'){if(!b.value){await rest('DELETE','presensi?user_id=eq.'+b.dataset.u+'&pertemuan=eq.'+b.dataset.p)}else await UP('presensi',{user_id:b.dataset.u,pertemuan:+b.dataset.p,status:b.value},'user_id,pertemuan');toast('Tersimpan ✔')}
  if(b.dataset.a==='gkel'){await rest('PATCH','profiles?id=eq.'+b.dataset.u,{kelompok:b.value.trim()},'return=minimal');toast('Kelompok diperbarui ✔')}
  if(b.dataset.a==='chk'){await UP('checklist',{item:b.dataset.i,done:b.checked},'item');const n=$$('[data-a=chk]:checked').length;$('#chkc').textContent=n+'/'+$$('[data-a=chk]').length}
  }catch(e){toast(e.message,1)}});
window.addEventListener('hashchange',route);
route();
